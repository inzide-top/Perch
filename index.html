<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PERCH</title>
    <script>
      ;(() => {
        const storageKey = 'agent-seek-employment:settings-store'
        let themeMode = 'system'

        try {
          const storedSettings = localStorage.getItem(storageKey)
          const parsedSettings = storedSettings ? JSON.parse(storedSettings) : null
          if (['light', 'dark', 'system'].includes(parsedSettings?.themeMode)) {
            themeMode = parsedSettings.themeMode
          }
        } catch {
          // 设置 Store 会在应用启动后清理无法解析的缓存，这里只负责首屏主题。
        }

        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle(
          'dark',
          themeMode === 'dark' || (themeMode === 'system' && prefersDark),
        )
      })()
    </script>
    <style>
      /* 首屏关键样式：避免 CSS 包加载前跳转链接作为普通内容闪现。 */
      .app-skip-link {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 9999;
        transform: translateY(-200%);
      }

      .app-skip-link:focus {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <a class="app-skip-link" href="#main-content">跳到主内容</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
