name: CI

on:
  push:
    branches: [main, feat/mockInterview]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Typecheck server
        run: pnpm typecheck:server

      - name: Run core tests
        run: pnpm test:core

      - name: Check Drizzle migrations
        run: pnpm exec drizzle-kit check

      - name: Build
        run: pnpm build
